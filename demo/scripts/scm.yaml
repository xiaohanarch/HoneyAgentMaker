# 供应链（库存）域的演示剧本（格式见 README.md）
scripts:
  - id: scm-below-safety-stock
    description: 孙库管问哪些物料低于安全库存：库存余额（摘要给出低于安全库存的条数）→ 在途订单 → 区分已有补货与需要补货
    agent: vendor.scm/inventory-risk-analyst
    match:
      any: [低于安全库存, 缺货]
    steps:
      - thought: 找出可用库存低于安全库存的物料，条数看统计摘要
        calls:
          - { tool: inventory_balance_list, args: { belowSafetyStock: true, limit: 8 } }
      - thought: 查看相关物料的在途补货订单
        calls:
          - { tool: purchase_order_list, args: { status: open, limit: 50 } }
      - reply: |
          低于安全库存的记录共 {{tools.inventory_balance_list.summary.belowSafetyStockCount}} 条，按缺口占安全库存的比例排列：
          {{#tools.inventory_balance_list.items}}
          - {{materialId}} {{materialName}}（{{warehouseName}}）：可用 {{quantity}} {{unit}}，安全库存 {{safetyStock}} {{unit}}
          {{/tools.inventory_balance_list.items}}

          在途补货：目前有 {{tools.purchase_order_list.total}} 张未完成的采购订单，其中逾期最长的 {{tools.purchase_order_list.items.0.id}}（{{tools.purchase_order_list.items.0.supplierName}}）已逾期 {{tools.purchase_order_list.items.0.overdueDays}} 天，会推迟补货。
          建议：缺口最大的物料优先确认在途订单的交期，没有在途补货的物料由采购部发起补货；需要时可以让我创建补货跟进任务。
        output:
          riskLevel: high
          shortageItems: "=tools.inventory_balance_list.items.map(b, {'materialId': b.materialId, 'quantity': b.quantity, 'safetyStock': b.safetyStock})"
          slowMovingItems: '=[]'
          actions: "=['确认在途订单交期', '对没有在途补货的物料发起补货']"

  - id: scm-slow-moving
    description: 孙库管问本月呆滞库存：库存余额的统计摘要给出呆滞金额与占比，不用逐行加总
    agent: vendor.scm/inventory-risk-analyst
    match:
      all: [呆滞]
    steps:
      - thought: 库存总金额、呆滞金额与占比在库存余额的统计摘要里，先取口径，再取几条呆滞记录举例
        calls:
          - { tool: semantic.get_metric, args: { name: slow_moving_ratio } }
          - { tool: inventory_balance_list, args: { slowMoving: slow, limit: 5 } }
      - reply: |
          本月库存总金额 {{tools.inventory_balance_list.summary.totalValue}}，其中库龄超过 180 天的呆滞库存 {{tools.inventory_balance_list.summary.slowMovingValue}}，占比 {{tools.inventory_balance_list.summary.slowMovingRatio}}%。
          口径说明：{{tools.semantic_get_metric.displayName}}，{{tools.semantic_get_metric.definition}}。口径来自语义包 {{tools.semantic_get_metric.provenance.semanticPack}}。

          其中几条呆滞记录：
          {{#tools.inventory_balance_list.items}}
          - {{materialId}} {{materialName}}（{{warehouseName}}）：库龄 {{ageDays}} 天，金额 {{value}}
          {{/tools.inventory_balance_list.items}}

          按规则 SCM-R-002，处置呆滞库存前必须确认物料没有未完成的生产需求，再评估调拨、折价或报废；另外低于安全库存的记录还有 {{tools.inventory_balance_list.summary.belowSafetyStockCount}} 条，需要分开处理。数据范围：{{tools.inventory_balance_list.scopeLabel}}。
        output:
          riskLevel: "=tools.inventory_balance_list.summary.slowMovingRatio > 5 ? 'high' : 'medium'"
          shortageItems: '=[]'
          slowMovingItems: "=tools.inventory_balance_list.items.map(b, {'materialId': b.materialId, 'value': b.value, 'ageDays': b.ageDays})"
          actions: "=['确认没有未完成的生产需求', '评估调拨、折价或报废']"

  - id: scm-create-followup
    description: 为物料创建补货跟进任务：调用创建跟进任务技能，触发 L2 确认，演示挂起与恢复
    agent: vendor.scm/inventory-risk-analyst
    match:
      all: [跟进任务]
      pattern: '(?<material>M-\d{4})'
    vars: { material: M-0007 }
    steps:
      - thought: 为 {{vars.material}} 创建补货跟进任务，写入前需要你确认
        calls:
          - tool: create-followup-task
            args:
              {
                title: '{{vars.material}} 补货跟进',
                assignee: 采购部,
                relatedObject: '{{vars.material}}',
              }
      - reply: '{{#tools.create_followup_task.item}}已创建跟进任务 {{id}}：“{{title}}”，指派给 {{assignee}}。{{/tools.create_followup_task.item}}{{#tools.create_followup_task.error}}没有创建跟进任务：{{reason}}{{/tools.create_followup_task.error}}'

  - id: scm-delivery-overdue-event
    description: 业务事件触发（受托自主运行）：交付逾期事件到达后，评估逾期物料对库存的影响，结果推送到委托人的通知区
    agent: vendor.scm/inventory-risk-analyst
    match:
      all: [交付逾期事件]
      pattern: '(?<material>M-\d{4})'
    vars: { material: M-0007 }
    steps:
      - thought: 定位逾期订单涉及的物料 {{vars.material}}，查看它的库存余额
        calls:
          - { tool: inventory_balance_list, args: { materialId: '{{vars.material}}' } }
      - reply: |
          交付逾期影响评估（受托自主运行，只读）：
          {{#tools.inventory_balance_list.items}}
          - {{materialId}} {{materialName}}（{{warehouseName}}）：可用 {{quantity}} {{unit}}，安全库存 {{safetyStock}} {{unit}}{{#belowSafetyStock}}，已低于安全库存{{/belowSafetyStock}}
          {{/tools.inventory_balance_list.items}}
          建议：优先与供应商确认逾期订单的新交期；可用量低于安全库存时，由采购部评估临时补货。本次为受托运行，没有执行任何写操作。
        output:
          riskLevel: "=tools.inventory_balance_list.items.exists(b, b.belowSafetyStock) ? 'high' : 'medium'"
          shortageItems: '=tools.inventory_balance_list.items.filter(b, b.belowSafetyStock).map(b, b.materialId)'
