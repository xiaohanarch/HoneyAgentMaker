# 故事 B 的演示剧本：星海制造对交易异常解析 Agent 的租户扩展生效之后（扩展增加了 notify_im 工具）。
# match.tools 表示只有这些工具可用时才匹配，所以扩展发布前仍走 fin.yaml 的标品剧本。
# 扩展追加的要求是“单笔超过 50 万元的异常须给出责任部门”；责任部门按异常类型对应，金额来自工具结果。
scripts:
  - id: story-b-anomaly-extended
    description: 王芳问本月高风险交易异常：取清单（统计摘要给出条数与金额合计）→ 经确认后发 IM 通知 → 结论里给出大额异常的责任部门
    agent: vendor.fin/transaction-anomaly-analyst
    match:
      all: [异常]
      any: [高风险, 严重, 本月]
      tools: [notify_im]
    steps:
      - thought: 取出本月严重程度为高和严重的交易异常，条数与金额合计看统计摘要
        calls:
          - {
              tool: transaction_anomaly_list,
              args: { severity: 'high,critical', period: '{{month}}', limit: 20 },
            }
      - thought: 按本公司要求，把高风险异常通知财务经理群（发送前需要你确认）
        calls:
          - tool: notify_im
            args:
              to: 财务经理群
              message: '本月有 {{tools.transaction_anomaly_list.summary.count}} 条高风险交易异常，涉及金额合计 {{tools.transaction_anomaly_list.summary.amountTotal}} {{tools.transaction_anomaly_list.items.0.currency}}，请关注。'
      - reply: |
          {{#tools.transaction_anomaly_list.platformConstraints}}按规则 {{rule}}：{{remedy}}。
          {{/tools.transaction_anomaly_list.platformConstraints}}本月（{{month}}）共有 {{output.anomalyCount}} 条高风险或严重的交易异常{{^tools.transaction_anomaly_list.platformConstraints}}，涉及金额合计 {{tools.transaction_anomaly_list.summary.amountTotal}} {{tools.transaction_anomaly_list.items.0.currency}}{{/tools.transaction_anomaly_list.platformConstraints}}。

          {{#output.kept}}
          - {{id}}（{{companyName}}）：{{anomalyType}}，严重程度 {{severity}}，金额 {{amount}} {{currency}}。{{description}}
          {{/output.kept}}

          按本公司规定，单笔金额超过 50 万元的异常须给出责任部门：
          {{#output.departments}}
          - {{id}}，金额 {{amount}}，责任部门：{{department}}
          {{/output.departments}}

          结论分两类：重复付款、拆分发票需要逐笔核对明细后确认，目前列为“疑似”，还缺付款凭证与审批记录。本 Agent 不执行付款、冲销等操作。
          已通知财务经理群。数据范围：{{tools.transaction_anomaly_list.scopeLabel}}。
        output:
          severity: "=tools.transaction_anomaly_list.items.exists(a, a.severity == 'critical') ? 'critical' : 'high'"
          # 经验回流写入的租户规则（P8）触发时，按规则排除跨期冲销类记录，与 fin.yaml 的标品剧本一致
          kept: "=has(tools.transaction_anomaly_list.platformConstraints) ? tools.transaction_anomaly_list.items.filter(a, a.anomalyType != 'reversal') : tools.transaction_anomaly_list.items"
          anomalyCount: "=has(tools.transaction_anomaly_list.platformConstraints) ? size(tools.transaction_anomaly_list.items.filter(a, a.anomalyType != 'reversal')) : tools.transaction_anomaly_list.summary.count"
          totalAmount: '=tools.transaction_anomaly_list.summary.amountTotal'
          currency: '{{tools.transaction_anomaly_list.items.0.currency}}'
          findings: "=tools.transaction_anomaly_list.items.map(a, {'id': a.id, 'type': a.anomalyType, 'amount': a.amount, 'severity': a.severity, 'status': '疑似'})"
          departments: "=tools.transaction_anomaly_list.items.filter(a, a.amount > 500000).map(a, {'id': a.id, 'amount': a.amount, 'department': {'duplicate_payment': '应付会计组', 'split_invoice': '采购部', 'reversal': '总账组', 'off_hours': '财务共享中心'}[a.anomalyType]})"
