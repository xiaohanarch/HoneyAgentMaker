# 采购域的演示剧本（格式见 README.md）。回复里的单号、天数、金额都来自本次运行的工具结果。
scripts:
  - id: pur-supplier-performance
    description: 张敏问供应商表现：确认供应商 → 交付 → 询价 → 综合评价，并按 PUR-R-007 提示风险
    agent: vendor.pur/supplier-performance-analyst
    match:
      any: [表现, 绩效, 怎么样]
      pattern: '(?<supplier>百润精密|恒通物流|华远电子|东瑞机械)'
    vars: { supplier: 百润精密 }
    steps:
      - thought: 先确认供应商 {{vars.supplier}} 的主数据和评级
        calls:
          - { tool: supplier-lookup, args: { supplierName: '{{vars.supplier}}' } }
      - thought: 统计 {{vars.supplier}} 的逾期订单和交付记录
        calls:
          - {
              tool: purchase_order_list,
              args: { supplierName: '{{vars.supplier}}', status: open, overdueDaysGt: 0 },
            }
          - { tool: delivery_list, args: { supplierName: '{{vars.supplier}}', limit: 50 } }
      - thought: 查看最近一次询价的报价情况
        calls:
          - { tool: rfq-lookup, args: { supplierName: '{{vars.supplier}}' } }
      - reply: |
          {{vars.supplier}}（{{tools.supplier_lookup.suppliers.0.id}}，{{tools.supplier_lookup.suppliers.0.rating}} 级，{{tools.supplier_lookup.suppliers.0.purchasingOrgName}}）综合评价：需要重点关注交付风险。

          交付：目前有 {{tools.purchase_order_list.total}} 张未交付的订单已超过计划交期，其中逾期超过 90 天的 {{output.longOverdueCount}} 张：
          {{#output.longOverdue}}
          - {{id}}，已逾期 {{overdueDays}} 天（计划交期 {{nextPlannedDate}}）
          {{/output.longOverdue}}
          近期交付记录 {{tools.delivery_list.total}} 条，其中晚于计划交付的 {{output.lateDeliveries}} 条。
          价格：最近一次询价 {{tools.rfq_lookup.rfqs.0.id}}（{{tools.rfq_lookup.rfqs.0.issuedAt}}），{{tools.rfq_lookup.rfqs.0.quotationLines.size}} 行报价，最低报价 {{tools.rfq_lookup.rfqs.0.lowestPrice}} {{tools.rfq_lookup.rfqs.0.currency}}，与目标价的差异率 {{tools.rfq_lookup.rfqs.0.priceVariance}}%。
          质量：合同质保 {{tools.supplier_lookup.suppliers.0.warrantyMonths}} 个月，本版本没有质量检验数据，不做推断。

          风险：存在逾期超过 90 天的订单。按规则 PUR-R-007，交付逾期超过 90 天的供应商不建议发起降价谈判，应先处理交付问题。
          依据的时间范围：截至 {{today}} 的订单与交付记录；数据范围：{{tools.purchase_order_list.scopeLabel}}。
        output:
          supplier: '{{vars.supplier}}'
          overallRating: risk
          maxOverdueDays: '=size(tools.purchase_order_list.items) > 0 ? tools.purchase_order_list.items[0].overdueDays : 0'
          longOverdue: "=tools.purchase_order_list.items.filter(p, p.overdueDays > 90).map(p, {'id': p.id, 'overdueDays': p.overdueDays, 'nextPlannedDate': p.nextPlannedDate})"
          longOverdueCount: '=size(tools.purchase_order_list.items.filter(p, p.overdueDays > 90))'
          lateDeliveries: '=size(tools.delivery_list.items.filter(d, d.actualDate != null && d.actualDate > d.plannedDate))'
          risks: "=tools.purchase_order_list.items.filter(p, p.overdueDays > 90).map(p, p.id + ' 逾期 ' + string(p.overdueDays) + ' 天')"

  - id: pur-overdue-delivery-rate
    description: 分析型：按语义包口径回答本季度逾期交付率，逾期条数与比率来自交付清单的统计摘要，数据按用户的采购组织过滤
    agent: vendor.pur/supplier-performance-analyst
    match:
      all: [逾期交付率]
    steps:
      - thought: 先取逾期交付率的口径，再取本季度交付记录的统计摘要
        calls:
          - { tool: semantic.get_metric, args: { name: overdue_delivery_rate } }
          - { tool: delivery_list, args: { from: '{{quarterStart}}', to: '{{today}}', limit: 10 } }
      - reply: |
          本季度（{{quarterStart}} 至 {{today}}）计划交付的记录共 {{tools.delivery_list.summary.matched}} 条，其中逾期 {{tools.delivery_list.summary.lateCount}} 条，逾期交付率 {{tools.delivery_list.summary.lateRate}}%。

          口径说明：{{tools.semantic_get_metric.displayName}}，{{tools.semantic_get_metric.definition}}。口径来自语义包 {{tools.semantic_get_metric.provenance.semanticPack}}。
          数据范围：{{tools.delivery_list.scopeLabel}}，只统计你有权查看的采购组织。
        output:
          period: '{{quarterStart}}'
          total: '=tools.delivery_list.summary.matched'
          late: '=tools.delivery_list.summary.lateCount'
          rate: '=tools.delivery_list.summary.lateRate'

  - id: pur-change-delivery-date
    description: 事务型：把订单交期改到下月 15 号，提交交期变更单，写入前需要确认
    agent: vendor.pur/purchase-order-clerk
    match:
      all: [交期]
      pattern: '(?<po>PO-\d{4}-\d{4})'
    steps:
      - thought: 为 {{vars.po}} 提交交期变更单，新交期 {{nextMonth}}-15，写入前需要你确认
        calls:
          - tool: purchase_order_change_delivery_date
            args: { poId: '{{vars.po}}', newDate: '{{nextMonth}}-15', reason: 用户在统一入口发起 }
      - reply: '{{#tools.purchase_order_change_delivery_date.item}}已提交交期变更单 {{id}}：{{poId}} 的交期由 {{oldDate}} 改为 {{newDate}}，当前状态为待审批。按职责分离要求，需要由你以外有审批权限的同事审批后才生效。{{/tools.purchase_order_change_delivery_date.item}}{{#tools.purchase_order_change_delivery_date.error}}没有提交交期变更：{{reason}}{{/tools.purchase_order_change_delivery_date.error}}'

  - id: pur-negotiation-policy
    description: 信息型：检索采购管理制度，回答附出处
    agent: vendor.pur/procurement-policy-advisor
    match:
      any: [制度, 规定, 办法]
    steps:
      - thought: 在采购管理制度里检索相关条款
        calls:
          - { tool: kb_procurement_policies, args: { query: '{{utterance}}' } }
      - reply: |
          {{#tools.kb_procurement_policies.items.0}}根据《{{title}}》，相关条款如下：{{/tools.kb_procurement_policies.items.0}}
          {{#tools.kb_procurement_policies.items}}

          {{text}}
          （出处：{{title}}，{{source}}）
          {{/tools.kb_procurement_policies.items}}

          以上是制度原文，具体执行以本企业正式发布的版本为准。
