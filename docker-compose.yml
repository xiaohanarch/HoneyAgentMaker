# docker compose up --build（独立安装的旧版 Compose 用 docker-compose up --build）
# 浏览器打开 http://localhost:5173
# 端口只绑定在本机回环地址；需要在局域网演示时，只放开 web 的 5173。
# 外部 Agent（4200 供应商风险舆情、4210 汇率查询）和第三方 MCP Server（4400）在容器网络里按服务名互通，不映射到宿主机。

x-env: &env
  EAB_HOST: 0.0.0.0
  LOG_LEVEL: info

x-app: &app
  build: .
  image: erp-agent-builder:local
  # 由 init 进程转发 SIGTERM，服务里的优雅关闭逻辑才能执行
  init: true

services:
  platform:
    <<: *app
    command: java -Dstdout.encoding=UTF-8 -jar backend/platform/target/platform-exec.jar
    environment:
      <<: *env
      EAB_PLATFORM_PORT: '4000'
      # 外部 Agent 的推送回调和连接别名在容器网络里的地址（P7）
      EAB_PUBLIC_URL: http://platform:4000
      EAB_SUPPLIER_RISK_URL: http://supplier-risk:4200
      EAB_FX_RATE_URL: http://fx-rate:4210
      EAB_LOGISTICS_MCP_URL: http://logistics-mcp:4400/mcp
    ports: ['127.0.0.1:4000:4000']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      retries: 12

  demo-erp:
    <<: *app
    command: java -Dstdout.encoding=UTF-8 -jar backend/demo-erp/target/demo-erp-exec.jar
    environment:
      <<: *env
      EAB_DEMO_ERP_PORT: '4100'
      EAB_PLATFORM_URL: http://platform:4000
    ports: ['127.0.0.1:4100:4100']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      retries: 12

  web:
    <<: *app
    command: pnpm --filter @eab/studio-web run start
    environment:
      <<: *env
      EAB_PLATFORM_URL: http://platform:4000
      EAB_DEMO_ERP_URL: http://demo-erp:4100
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      platform: { condition: service_healthy }
      demo-erp: { condition: service_healthy }

  # 供应商风险舆情 Agent（Python 3.12 + uv + LangGraph）；用 uv 官方镜像，依赖按 uv.lock 安装
  supplier-risk:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    init: true
    working_dir: /app
    volumes: ['./external-agents/supplier-risk-py:/src:ro']
    command: sh -c "cp -r /src/. /app && uv sync --frozen && uv run --frozen python -m supplier_risk.app"
    environment:
      HOST: 0.0.0.0
      PORT: '4200'
      PUBLIC_URL: http://supplier-risk:4200
      EAB_PLATFORM_URL: http://platform:4000

  # 汇率查询 Agent（A2A 官方 JS SDK，不用 Agent 框架）
  fx-rate:
    <<: *app
    command: pnpm --filter @eab/fx-rate-ts run start
    environment:
      <<: *env
      PORT: '4210'
      HOST: 0.0.0.0
      PUBLIC_URL: http://fx-rate:4210
      EAB_PLATFORM_URL: http://platform:4000

  # 物流跟踪 MCP Server（MCP 官方 TypeScript SDK，Streamable HTTP）
  logistics-mcp:
    <<: *app
    command: pnpm --filter @eab/logistics-mcp run start
    environment:
      <<: *env
      PORT: '4400'
      HOST: 0.0.0.0
