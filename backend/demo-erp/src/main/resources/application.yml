# DemoERP 配置。环境变量名与 TS 版保持一致，pnpm demo、docker-compose、systemd 单元共用。
server:
  port: ${EAB_DEMO_ERP_PORT:4100}
  address: ${EAB_HOST:127.0.0.1}
  shutdown: graceful

spring:
  application:
    name: demo-erp
  threads:
    virtual:
      enabled: true

# OpenAPI 描述由 OpenApiController 和 BoController 按路由声明生成，路径与 TS 版相同
eab:
  data-dir: ${EAB_DATA_DIR:}
  db-path: ${EAB_ERP_DB_PATH:}
  platform-url: ${EAB_PLATFORM_URL:http://127.0.0.1:4000}
  internal-secret: ${EAB_INTERNAL_SECRET:}
  seed-data: ${EAB_SEED_DATA:true}

logging:
  level:
    root: ${LOG_LEVEL:info}
