# 技能骨架：把 <占位> 换成真实内容，文件名与 metadata.name 按业务改名（skills/<新名>.yaml），
# 扩展资产里的 skills.add 引用要跟着改。
# writeLevel 按实际写操作级别填：L0 只读、L1 写业务单据、L2 需人工确认的写。
apiVersion: eab.dev/v1
kind: Skill
metadata:
  name: {{name}}-skill
  namespace: tenant.<改我>.skills
  version: 1.0.0
  displayName: <技能显示名>
  description: <技能做什么>
  owner: <登录用户>
spec:
  writeLevel: L0
  inputSchema:
    type: object
    required: [<参数名>]
    properties:
      <参数名>: { type: string, description: <参数说明> }
  outputSchema:
    type: object
    properties:
      <结果字段>: { type: string, description: <字段说明> }
  steps:
    - id: query
      type: tool
      name: <步骤名>
      tool: <BO 操作名>
      source: vendor.erp.tools/demo-erp-bo
      with: { <参数名>: input.<参数名> }
      output: result
    - id: summary
      type: transform
      name: 返回工具结果
      expression: result
