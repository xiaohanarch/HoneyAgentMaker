# 平台主服务配置。环境变量名与 TS 版保持一致，pnpm demo、docker-compose、systemd 单元共用。
server:
  port: ${EAB_PLATFORM_PORT:4000}
  address: ${EAB_HOST:127.0.0.1}
  shutdown: graceful
  # 反向代理（如 Caddy）转发时按 X-Forwarded-For 还原真实客户端地址（登录限流用）；本地直连时保持 none
  forward-headers-strategy: ${EAB_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: platform
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

eab:
  data-dir: ${EAB_DATA_DIR:}
  assets-dir: ${EAB_ASSETS_DIR:}
  db-path: ${EAB_DB_PATH:}
  ephemeral-keys: false
  seed-assets: true
  demo-mode: ${EAB_DEMO_MODE:false}
  internal-secret: ${EAB_INTERNAL_SECRET:}
  demo-erp-url: ${EAB_DEMO_ERP_URL:http://127.0.0.1:4100}
  scripts-dir: ${EAB_SCRIPTS_DIR:}
  otlp-endpoint: ${EAB_OTLP_ENDPOINT:}
  # 平台对外地址，远程 Agent 的推送回调发到这里；为空时用本机回环地址加监听端口
  public-url: ${EAB_PUBLIC_URL:}
  # A2A 同步等待的上限，超过后转为异步任务（主提示词 8.4 节）
  a2a-timeout-seconds: ${EAB_A2A_TIMEOUT_SECONDS:60}
  # 连接别名在本环境的绑定（部署配置，不进资产），优先于租户 Connection 资产的 prod 绑定
  connections:
    '[SUPPLIER_RISK_AGENT]': ${EAB_SUPPLIER_RISK_URL:http://127.0.0.1:4200}
    '[FX_RATE_AGENT]': ${EAB_FX_RATE_URL:http://127.0.0.1:4210}
    '[LOGISTICS_MCP]': ${EAB_LOGISTICS_MCP_URL:http://127.0.0.1:4400/mcp}
  # 选人登录接口的限流（每 IP 每分钟）。生产保持 30；演示环境里端到端测试、验收脚本和多个页面共用
  # 127.0.0.1 一个来源地址，需要更大的余量，由 pnpm demo 用环境变量调高
  login-rate-per-minute: ${EAB_LOGIN_RATE_PER_MINUTE:30}
  # 公网演示访问的按身份口令（user:pass,...，* 为缺省条目），只放在仓库外的 access.env；
  # 未设置时选人即登录不受影响
  demo-passcodes: ${EAB_DEMO_PASSCODES:}

# 所有对外接口的 OpenAPI 描述（主提示词第 14 节），路径与 TS 版相同
springdoc:
  api-docs:
    path: /openapi.json

logging:
  level:
    root: ${LOG_LEVEL:info}
