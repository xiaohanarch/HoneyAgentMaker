# 平台主服务配置。环境变量名与 TS 版保持一致，pnpm demo、docker-compose、systemd 单元共用。
server:
  port: ${EAB_PLATFORM_PORT:4000}
  address: ${EAB_HOST:127.0.0.1}
  shutdown: graceful

spring:
  application:
    name: platform
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

eab:
  data-dir: ${EAB_DATA_DIR:}
  assets-dir: ${EAB_ASSETS_DIR:}
  db-path: ${EAB_DB_PATH:}
  ephemeral-keys: false
  seed-assets: true
  demo-mode: ${EAB_DEMO_MODE:false}
  internal-secret: ${EAB_INTERNAL_SECRET:}

# 所有对外接口的 OpenAPI 描述（主提示词第 14 节），路径与 TS 版相同
springdoc:
  api-docs:
    path: /openapi.json

logging:
  level:
    root: ${LOG_LEVEL:info}
